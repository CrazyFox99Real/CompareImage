<!doctype html><html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>CompareLab</title><link rel="stylesheet" href="style.css"></head><body>
<section id="home" class="screen">
<header class="homeHead"><div><div class="eyebrow">IMAGE COMPARISON STUDIO</div><h1>Compare<span>Lab</span></h1><p>Ogni dettaglio, a colpo d'occhio.</p></div><div class="logo">◫</div></header>
<div class="homeBody"><button id="create" class="primary big">＋ Nuovo confronto</button><div class="sectionTitle"><h2>I tuoi progetti</h2><span id="count"></span></div><div id="projectList"></div></div>
</section>
<section id="editor" class="screen hidden">
<div class="topbar"><button id="back" class="iconbtn">‹</button><div class="titleWrap"><input id="projectName" aria-label="Nome progetto" placeholder="Nome progetto"><div class="subline">Modifiche salvate sul dispositivo</div></div><button id="save" class="smallbtn">Salva</button></div>
<div class="filebar"><div class="filetile"><button class="slot" data-slot="0"><span class="slotLetter">A</span><span id="name0" class="slotname">Carica immagine A</span><span class="upload">⇪</span></button></div><button id="swap" class="swap" title="Scambia A e B">⇄</button><div class="filetile"><button class="slot" data-slot="1"><span class="slotLetter slotB">B</span><span id="name1" class="slotname">Carica immagine B</span><span class="upload">⇪</span></button></div></div>
<div id="viewport" class="viewport"><div id="canvasArea" class="canvasArea"><div id="aFrame" class="frame"><img id="imgA" alt="Immagine A"></div><div id="bFrame" class="frame"><img id="imgB" alt="Immagine B"></div><canvas id="diffCanvas"></canvas><div id="line" class="divline hidden"><span class="handle">↔</span></div><div id="placeholder" class="placeholder"><div class="emptyIcon">◧</div><strong>Aggiungi due immagini</strong><small>PNG, JPG, WEBP e GIF animate</small></div></div><div class="viewportInfo"><span id="modeName">Fianco a fianco</span><span id="sizeInfo">—</span></div></div>
<div class="controls"><div class="modeScroller"><button data-mode="side" class="mode active">◫<small>Affiancate</small></button><button data-mode="hold" class="mode">◉<small>Premi</small></button><button data-mode="wipeX" class="mode">◧<small>Slider ↔</small></button><button data-mode="wipeY" class="mode">⬒<small>Slider ↕</small></button><button data-mode="ghost" class="mode">◎<small>Ghosting</small></button><button data-mode="diff" class="mode">✳<small>Differenze</small></button></div>
<div id="modeControls" class="options"></div><div class="zoomrow"><span>Zoom</span><input id="zoom" type="range" min="100" max="400" step="5" value="100"><span id="zoomLabel">100%</span><button id="reset" class="smallbtn">Centra</button></div><p class="tip" id="tip">Trascina sulle immagini per spostarle insieme quando sono ingrandite.</p></div>
<input type="file" id="pick" accept="image/*,.gif" multiple hidden>
<div id="toast" class="toast hidden"></div>
</section><script src="app.js"></script></body></html>
